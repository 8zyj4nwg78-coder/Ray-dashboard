<title>Ray Builders Project Controls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: job-site look. Asphalt-dark ground with a faint blueprint grid, safety-yellow accent, hazard-stripe edges, steel-plate panels, signage type. Phone first, 2-col list on desktop. */
:root{
  color-scheme: dark;
  --bg:#101113; --panel:#1a1b1e; --panel2:#24252a; --line:#303237; --line2:#44464d;
  --fg:#f3f1ea; --muted:#a29e94; --dim:#6c6961;
  --accent:#ffc20e; --accent-ink:#121212; --accent-soft:rgba(255,194,14,.13); --accent-line:rgba(255,194,14,.55);
  --red:#f2554d; --red-soft:rgba(242,85,77,.13); --amber:#ff8a1f; --amber-soft:rgba(255,138,31,.13);
  --stripe:#121212; --grid:rgba(255,255,255,.028);
  --green:#3dbb88; --green-soft:rgba(61,187,136,.13); --blue:#58a2ec; --blue-soft:rgba(88,162,236,.13);
  --grey-soft:rgba(141,153,167,.14);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:4px;
  --hazard:repeating-linear-gradient(-45deg,var(--accent) 0 11px,var(--stripe) 11px 22px);
  --hazard-red:repeating-linear-gradient(-45deg,var(--red) 0 7px,var(--stripe) 7px 14px);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(13,17,22,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.mark{width:34px;height:34px;flex:none;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.02em}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand h1,.brand .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.brand .grow{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{border-color:var(--line2)}
.iconbtn svg{width:20px;height:20px}

.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;margin-inline:-16px;padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.jobchip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.jobchip .jn{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.jobchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.jobchip[aria-pressed="true"] .jn{color:var(--dim)}
.jobchip.add{border-style:dashed;color:var(--accent);border-color:var(--accent-line);background:transparent}

/* Sample banner */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px;padding:10px 12px;border:1px solid rgba(255,138,31,.4);background:var(--amber-soft);border-radius:var(--r);font-size:13.5px}
.banner b{color:var(--amber)}
.banner .grow{flex:1;min-width:180px}
.banner.warn{border-color:rgba(242,85,77,.4);background:var(--red-soft)}
.banner.warn b{color:var(--red)}

/* Job header */
.jobhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.jobhead h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
.jobhead .meta{color:var(--muted);font-size:13px;margin-top:4px}
.jobhead .meta span+span::before{content:" · "}
.today{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* Job info panel */
.jobinfo{width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:4px}
@media(min-width:820px){.jobinfo{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}.jobinfo .quick{grid-column:1/-1}}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.person,.stage{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:11px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.person b{font-size:15.5px;overflow-wrap:anywhere}
.person .phone{align-self:flex-start;font-size:12.5px;padding:4px 8px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.none{color:var(--dim);font-weight:500}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:2px 0}
.st-name{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.bar{height:8px;border-radius:8px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.st-foot{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.st-foot .pct{font-family:var(--f-mono);color:var(--fg);font-weight:600}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media(max-width:520px){.quick{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qk{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:9px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-width:0}
.qk:hover{border-color:var(--line2)}
.qk b{font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.qk span{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qk small{font-size:11.5px;color:var(--amber)}
.qk.hot{border-color:rgba(242,85,77,.55)}.qk.hot b,.qk.hot small{color:var(--red)}
.roster{width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:4px}
@media(min-width:700px){.roster{grid-template-columns:repeat(3,minmax(0,1fr))}}
.jobcard{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:7px;min-width:0}
.jobcard:hover{border-color:var(--line2)}
.jobcard.hot{border-color:rgba(242,85,77,.45)}
.jc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.jc-top b{font-size:16px;overflow-wrap:anywhere}
.jc-stage{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.jc-stage span{font-family:var(--f-mono);color:var(--muted);font-size:12.5px}
.jc-ppl{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.jc-ppl b{color:var(--fg);font-weight:600}
.phone.mail{font-size:12.5px;overflow-wrap:anywhere;user-select:all}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 12px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:hover{border-color:var(--line2)}
.kpi .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .foot{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hot{border-color:rgba(242,85,77,.55);background:linear-gradient(180deg,var(--red-soft),transparent 80%),var(--panel)}
.kpi.hot .val,.kpi.hot .lbl{color:var(--red)}
.kpi.money .val{font-size:30px}

/* Category tabs */
.tabsbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,112px));z-index:15;background:var(--bg);padding-top:16px;margin-top:6px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:10px 10px 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab .ct{font-family:var(--f-mono);font-size:11px;background:var(--panel2);color:var(--muted);padding:1px 6px;border-radius:5px;font-weight:600}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .ct{background:var(--accent-soft);color:var(--accent)}
.tab.due .ct{background:var(--red-soft);color:var(--red)}

/* Toolbar */
.toolbar{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.search{flex:1 1 200px;min-width:0;position:relative}
.search input{width:100%;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel);padding:0 12px 0 36px}
.search svg{position:absolute;left:11px;top:12px;width:18px;height:18px;color:var(--muted)}
.toggle{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel);padding:0 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.toggle[aria-pressed="true"]{color:var(--fg);border-color:var(--line2);background:var(--panel2)}
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:18px}
.listhead h3{margin:0;font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.listhead .hint{font-size:12.5px;color:var(--muted)}
.tally{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right}
.tally b{color:var(--fg);font-weight:600}

/* Cards */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:12px;padding-bottom:120px}
@media(min-width:820px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer}
.card:hover{border-color:var(--line2)}
.card.late{border-color:rgba(242,85,77,.6);box-shadow:inset 3px 0 0 var(--red)}
.card.closed{opacity:.62}
.c-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.c-top .sp{flex:1}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;white-space:nowrap}
.t-green{background:var(--green-soft);color:var(--green)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-blue{background:var(--blue-soft);color:var(--blue)}
.t-grey{background:var(--grey-soft);color:var(--muted)}
.pill.od{background:var(--red);color:#fff}
.c-title{font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.c-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.c-meta .amt{color:var(--fg);font-family:var(--f-mono);font-size:13px;font-weight:600}
.c-meta .amt small{color:var(--muted);font-weight:500}
.c-notes{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.due{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.due.late{color:var(--red);font-weight:600}
.due.soon{color:var(--amber)}
.jobtag{margin-left:auto;font-size:11.5px;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:5px;white-space:nowrap}
.cat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
.subrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phone{font-family:var(--f-mono);font-size:13.5px;color:var(--fg);text-decoration:none;border:1px solid var(--line);padding:5px 9px;border-radius:7px;background:var(--panel2);user-select:all}
.ns{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:auto}
.ns span{padding:4px 9px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.ns span b{font-family:var(--f-mono);color:var(--fg)}
.ns.bad{border-color:rgba(242,85,77,.55)}
.ns.bad span,.ns.bad span b{color:var(--red)}
.ns button{border:0;border-left:1px solid var(--line);background:var(--panel2);width:34px;height:30px;font-weight:700}

.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* FAB */
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;height:56px;padding:0 20px 0 16px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.fab svg{width:22px;height:22px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;max-height:92%;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-bottom:0;border-radius:16px 16px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;border-bottom:1px solid var(--line2);max-height:88%}}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line2);margin:4px auto 10px}
.sheet h4{margin:0 0 2px;font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.sheet .shint{font-size:13px;color:var(--muted);margin:0 0 12px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{width:100%;min-width:0;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 11px;font-size:16px}
.f textarea{height:auto;min-height:92px;padding:10px 11px;resize:vertical;line-height:1.4}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none}
.f .err{color:var(--red);font-size:12.5px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{height:46px;border-radius:10px;padding:0 18px;border:1px solid var(--line2);background:var(--panel2);font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.danger{color:var(--red);border-color:rgba(242,85,77,.45);background:transparent}
.btn.danger.arm{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#1b1404}
.menu{display:flex;flex-direction:column;gap:10px}
.mrow{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.mrow .t{font-weight:700}
.mrow .d{font-size:13px;color:var(--muted)}
.mrow .r{display:flex;gap:8px;flex-wrap:wrap}
.jobline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.jobline .grow{flex:1;min-width:0}
.jobline .n{font-weight:600;overflow-wrap:anywhere}
.jobline .m{font-size:12.5px;color:var(--muted)}
textarea.code{font-family:var(--f-mono);font-size:12px;min-height:140px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
/* Team, assignments, files */
.mebtn{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:8px;padding:0 10px 0 5px;font-weight:600;font-size:13.5px;max-width:150px}
.mebtn .av{width:30px;height:30px;font-size:12px}
.mebtn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:24px;height:24px;flex:none;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:10.5px;color:#0d1116;background:var(--muted);letter-spacing:.02em}
.who{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 2px;white-space:nowrap}
.who.none{color:var(--dim);border-style:dashed;padding-left:9px}
.who .av{width:20px;height:20px;font-size:9.5px}
.pickrow{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:5px 14px 5px 5px;display:flex;align-items:center;gap:8px;font-weight:600}
.pick .av{width:28px;height:28px;font-size:11px}
.pick small{color:var(--muted);font-weight:500;font-size:12px}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.toolbar select.toggle{appearance:auto;padding-right:8px;max-width:170px}
.files{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px}
.files-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.files-h b{font-family:var(--f-display);font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.files-h small{color:var(--muted);font-size:12.5px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:thin}
.thumbs.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));overflow:visible}
.thumb{flex:none;width:104px;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column;min-width:0}
.thumbs.grid .thumb{width:auto}
.thumb .img{aspect-ratio:1/1;width:100%;max-width:100%;display:grid;place-items:center;background:var(--panel2);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .doc{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--accent);border:2px solid var(--accent);border-radius:5px;padding:6px 8px}
.thumb .cap{font-size:11.5px;padding:5px 7px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
(() => {
"use strict";
const UIKEY = "raybuilders.ui.v2", MEKEY = "raybuilders.me", OLDKEY = "raybuilders.pc.v1", IMPORTED = "raybuilders.imported";

/* ---------- Categories ---------- */
const CATS = [
  {k:"task", one:"Task", label:"Team Tasks", short:"Tasks", pre:"T", statuses:["To Do","In Progress","Done"], done:["Done"], party:"Related company (optional)", due:"Due", hint:"Work assigned to a team member. Pick who it's for under Assigned to."},
  {k:"open", one:"Open Item", label:"Open Items", short:"Open Items", pre:"OI", statuses:["Open","In Progress","Closed"], done:["Closed"], party:"Responsible", due:"Follow-up date", hint:"Anything still hanging on the job."},
  {k:"tkt", one:"Ticket", label:"Open Tickets", short:"Tickets", pre:"TKT", statuses:["Open","In Progress","Closed"], done:["Closed"], party:"Company", due:"Due", money:true, hint:"Work, service and T&M tickets on the job. Amount is optional."},
  {k:"owner", one:"Owner Question", label:"Owner Questions", short:"Owner Qs", pre:"OQ", statuses:["To Ask","Asked","Answered"], done:["Answered"], party:"Asked to", due:"Need answer by", hint:"Decisions and answers you need from the owner."},
  {k:"rfi", one:"RFI", label:"RFIs", short:"RFIs", pre:"RFI", statuses:["Draft","Open","Answered","Closed"], done:["Answered","Closed"], party:"Sent to", due:"Response due", hint:"Numbered requests for information to the design team."},
  {k:"subm", one:"Submittal", label:"Submittals", short:"Submittals", pre:"SUB", statuses:["Pending","Submitted","Revise & Resubmit","Approved"], done:["Approved"], party:"From (sub / supplier)", due:"Due / follow-up", hint:"Pending, submitted, revise & resubmit, approved."},
  {k:"dwg", one:"Drawing", label:"Drawings", short:"Drawings", pre:"DWG", statuses:["Under Review","Current","Superseded"], done:["Current","Superseded"], party:"From", due:"Review by", hint:"Every drawing for the job: final sets, field markups and shop drawings. Attach the PDF to each one.", types:["Final","Markup","Shop Drawing"]},
  {k:"inv", one:"Invoice", label:"Invoices", short:"Invoices", pre:"INV", statuses:["Draft","Sent","Partially Paid","Paid"], done:["Paid"], party:"Billed to", due:"Payment due", money:true, paid:true, hint:"Pay apps and bills you sent. Unpaid = money owed to you."},
  {k:"co", one:"Change Order", label:"Change Orders", short:"COs", pre:"CO", statuses:["Pending","Submitted","Approved","Rejected"], done:["Approved","Rejected"], party:"Requested by / sent to", due:"Decision by", money:true, hint:"Track pricing and approval of changes."},
  {k:"subs", one:"Subcontractor", label:"Subcontractors", short:"Subs", pre:"SC", statuses:["Active","Not Started","Off Job"], done:["Off Job"], party:"Contact person", due:"Next follow-up", hint:"Trade, phone and no-show count for each sub on the job.", dir:true, titleLabel:"Company name", tradeLabel:"Trade", tradePh:"e.g. Electrical", ns:true},
  {k:"vend", one:"Vendor", label:"Vendors & Suppliers", short:"Vendors", pre:"V", statuses:["Active","Not Started","Done"], done:["Done"], party:"Contact person", due:"Next follow-up", hint:"Sub-vendors and suppliers furnishing material or equipment for the job.", dir:true, titleLabel:"Company name", tradeLabel:"Supplies", tradePh:"e.g. Lumber, windows, HVAC equipment"},
  {k:"contact", one:"Contact", label:"Contacts", short:"Contacts", pre:"C", statuses:["Active","Inactive"], done:["Inactive"], party:"Company", due:"Follow-up", hint:"Everyone on the job: owner, architect, engineers, inspectors, utilities.", dir:true, titleLabel:"Name", tradeLabel:"Role", tradePh:"e.g. Architect, Owner's rep, Inspector", email:true, noDue:true},
  {k:"quote", one:"Quote", label:"Quotes to Get", short:"Quotes", pre:"Q", statuses:["Need to Request","Requested","Received"], done:["Received"], party:"Vendor", due:"Need by", money:true, hint:"Pricing you still need to chase."},
  {k:"prop", one:"Proposal", label:"Proposals to Sign", short:"Proposals", pre:"P", statuses:["To Review","Ready to Sign","Signed","Declined"], done:["Signed","Declined"], party:"From", due:"Sign by", money:true, hint:"Sub and vendor proposals waiting on your signature."},
  {k:"owed", one:"Payable", label:"Who's Owed", short:"Owed", pre:"PAY", statuses:["Owed","Partially Paid","Paid"], done:["Paid"], party:"Pay to", due:"Pay by", money:true, paid:true, hint:"Money you owe subs and suppliers."},
];
const CAT = Object.fromEntries(CATS.map(c => [c.k, c]));
const FILE_CATS = [{k:"general", label:"General / site photos"}].concat(CATS.map(c => ({k:c.k, label:c.label})));
const fileCatLabel = k => (FILE_CATS.find(c => c.k === k) || {label:"General"}).label;
const NEG = ["Revise & Resubmit","Rejected","Declined"];
const NEUTRAL = ["Draft","Pending","To Ask","Need to Request","To Review","Not Started","Superseded","To Do"];
const STAGES = ["Preconstruction","Permits","Site Work","Foundation","Framing","Roofing & Envelope","Rough-ins (MEP)","Insulation & Drywall","Finishes","Punch List","Closeout","On Hold"];
const AV_COLORS = ["#f47b20","#58a2ec","#3dbb88","#e9b63b","#c58af0","#ef7aa0","#5fd0c8","#b7c46a"];

/* ---------- Dates & money ---------- */
const pad = n => String(n).padStart(2,"0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = isoOf(new Date());
const dayDiff = iso => { const [y,m,d] = iso.split("-").map(Number); const a = Date.UTC(y,m-1,d); const t = new Date(); return Math.round((a - Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/864e5); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = iso => { const [y,m,d] = iso.split("-").map(Number); return `${MON[m-1]} ${d}` + (y !== new Date().getFullYear() ? `, ${y}` : ""); };
const fmtStamp = ms => { const d = new Date(ms); return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const money = n => "$" + Math.round(Number(n)||0).toLocaleString("en-US");
const moneyShort = n => { n = Number(n)||0; if (Math.abs(n) >= 1e6) return "$" + (n/1e6).toFixed(2).replace(/\.?0+$/,"") + "M"; if (Math.abs(n) >= 1e4) return "$" + (n/1e3).toFixed(1).replace(/\.0$/,"") + "K"; return money(n); };
const fmtSize = b => b > 1048576 ? (b/1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b/1024)) + " KB";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
};

/* ---------- State ---------- */
const state = {jobs:[], items:[], team:[], files:[]};
const loaded = {jobs:false, items:false, team:false, files:false};
let conn = "connecting";      // connecting | live | offline
let DB = null, ASSETS = null, USER = null, readOnly = false;
const ui = Object.assign({job:"all", tab:"due", q:"", showClosed:false, who:""}, (() => { try { return JSON.parse(ls.get(UIKEY)) || {}; } catch(e){ return {}; } })());
if (ui.tab !== "due" && ui.tab !== "mine" && ui.tab !== "files" && !CAT[ui.tab]) ui.tab = "due";
let me = ls.get(MEKEY) || "";
const allLoaded = () => loaded.jobs && loaded.items && loaded.team && loaded.files;

/* ---------- Item logic ---------- */
const isDone = it => CAT[it.cat] ? CAT[it.cat].done.includes(it.status) : false;
const isLate = it => !!it.due && !isDone(it) && it.due < TODAY;
const unpaid = it => Math.max(0, (Number(it.amount)||0) - (Number(it.paid)||0));
const tone = it => {
  if (NEG.includes(it.status)) return "t-red";
  if (isDone(it)) return it.status === "Superseded" ? "t-grey" : "t-green";
  if (NEUTRAL.includes(it.status)) return "t-grey";
  if (["Partially Paid","Asked","Ready to Sign","Owed"].includes(it.status)) return "t-amber";
  return "t-blue";
};

/* ---------- Team helpers ---------- */
const sortedTeam = () => state.team.slice().sort((a,b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(b.name));
const member = id => state.team.find(m => m.id === id);
const initials = n => String(n||"?").trim().split(/\s+/).map(w => w[0]).join("").slice(0,2).toUpperCase() || "?";
const avColor = id => { let h = 0; for (const c of String(id)) h = (h*31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; };
const av = m => m ? `<span class="av" style="background:${avColor(m.id)}">${esc(initials(m.name))}</span>` : `<span class="av">?</span>`;
const whoChip = id => { const m = member(id); return m ? `<span class="who">${av(m)}${esc(m.name)}</span>` : ""; };

/* ---------- Shared database ---------- */
const COLS = ["jobs","items","team","files"];
const chains = {};
let renderQueued = false;
function scheduleRender(){ if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

function strip(o){ const c = {...o}; delete c.id; for (const k of Object.keys(c)) if (c[k] === undefined) delete c[k]; return c; }
function write(col, id, data){
  if (!DB) { toast("Not connected, so this change was not saved."); return Promise.reject({code:"offline"}); }
  const key = col + "/" + id;
  const run = () => data ? DB.collection(col).doc(id).set(strip(data)) : DB.collection(col).doc(id).delete();
  const attempt = () => run().catch(e => {
    if (e && e.code === "unavailable") return new Promise(r => setTimeout(r, 600 + Math.random()*600)).then(run);
    throw e;
  });
  const p = (chains[key] || Promise.resolve()).catch(() => {}).then(attempt);
  chains[key] = p;
  p.catch(writeError);
  return p;
}
let lastErrToast = 0;
function writeError(e){
  const code = e && e.code;
  if (code === "offline") return;
  if (Date.now() - lastErrToast < 3000) return; lastErrToast = Date.now();
  if (code === "invalid_argument" || code === "not_granted" || code === "revoked") { readOnly = true; render(); toast("You have view-only access, so changes aren't saved. Ask the owner to share it with you as Editor."); }
  else if (code === "quota_exceeded") toast("Storage is full. Delete old items or files, then try again.");
  else if (code === "resource_exhausted") toast("Too many changes at once. Wait a few seconds and try again.");
  else toast("Couldn't save. Check your connection and try again.");
}
function putDoc(col, rec){ const arr = state[col]; const i = arr.findIndex(x => x.id === rec.id); if (i >= 0) arr[i] = rec; else arr.push(rec); scheduleRender(); return write(col, rec.id, rec); }
function delDoc(col, id){ state[col] = state[col].filter(x => x.id !== id); scheduleRender(); return write(col, id, null); }

async function connect(){
  const use = window.claude && typeof window.claude.use === "function" ? n => window.claude.use(n).catch(() => null) : () => Promise.resolve(null);
  const dbx = await use("db");
  if (!dbx) { conn = "offline"; render(); return; }
  DB = dbx;
  for (const col of COLS) {
    DB.collection(col).onSnapshot(snap => {
      state[col] = snap.docs.map(d => ({...d.data(), id: d.id}));
      loaded[col] = true;
      if (allLoaded()) conn = "live";
      scheduleRender();
    }, err => { if (err && err.code === "revoked") { conn = "offline"; DB = null; } scheduleRender(); });
  }
  use("assets").then(a => { ASSETS = a; scheduleRender(); });
  use("user").then(async u => {
    USER = u; if (!u) return;
    try { if (await u.can("data.write") === false) { readOnly = true; scheduleRender(); } } catch(e){}
    if (!me) {
      try {
        const nm = ((await u.me()).name || "").trim().split(/\s+/)[0].toLowerCase();
        const tryMatch = () => { if (me || !nm || !loaded.team) return false; const hits = state.team.filter(m => String(m.name).trim().split(/\s+/)[0].toLowerCase() === nm); if (hits.length === 1) { setMe(hits[0].id); } return true; };
        if (!tryMatch()) { const t = setInterval(() => { if (tryMatch()) clearInterval(t); }, 500); setTimeout(() => clearInterval(t), 15000); }
      } catch(e){}
    }
  });
  scheduleRender();
}
function setMe(id){ me = id; ls.set(MEKEY, id); scheduleRender(); }

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const jobById = id => state.jobs.find(j => j.id === id);
const sortedJobs = () => state.jobs.slice().sort((a,b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(b.name));
const scoped = () => ui.job === "all" ? state.items : state.items.filter(i => i.jobId === ui.job);
const scopedFiles = () => ui.job === "all" ? state.files : state.files.filter(f => f.jobId === ui.job);
function nextNum(jobId, cat){
  const pre = CAT[cat].pre; let max = 0;
  for (const i of state.items) if (i.jobId === jobId && i.cat === cat) { const m = String(i.num).match(/(\d+)\s*$/); if (m) max = Math.max(max, +m[1]); }
  return `${pre}-${String(max+1).padStart(3,"0")}`;
}
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
function sortItems(arr){
  return arr.slice().sort((a,b) => {
    const da = isDone(a), dbb = isDone(b); if (da !== dbb) return da ? 1 : -1;
    const la = isLate(a), lb = isLate(b); if (la !== lb) return la ? -1 : 1;
    if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    if (!!a.due !== !!b.due) return a.due ? -1 : 1;
    return String(a.num).localeCompare(String(b.num), undefined, {numeric:true});
  });
}
const phoneLink = ph => `<a class="phone" href="tel:${esc(String(ph).replace(/[^\d+]/g,""))}" data-stop="1">${esc(ph)}</a>`;
const blobUrl = f => "/_blob/" + f.assetId;
const isImg = f => /^image\//.test(f.type||"");
const isVid = f => /^video\//.test(f.type||"");
const extOf = f => ((String(f.name||"").match(/\.([a-z0-9]{1,5})$/i)||[])[1] || (f.type==="application/pdf" ? "pdf" : "file")).toUpperCase();

/* ---------- Render ---------- */
function render(){
  if (loaded.jobs && ui.job !== "all" && !jobById(ui.job)) ui.job = "all";
  renderMe(); renderJobs(); renderBanners(); renderHead(); renderKpis(); renderTabs(); renderFilesStrip(); renderList();
  ls.set(UIKEY, JSON.stringify(ui));
}

function renderMe(){
  const m = member(me);
  $("meAv").outerHTML = m ? av(m).replace('class="av"', 'class="av" id="meAv"') : `<span class="av" id="meAv">?</span>`;
  $("meName").textContent = m ? m.name : "Who are you?";
}

function renderJobs(){
  const chips = [`<button class="jobchip" data-job="all" aria-pressed="${ui.job==="all"}">All jobs</button>`]
    .concat(sortedJobs().map(j => `<button class="jobchip" data-job="${esc(j.id)}" aria-pressed="${ui.job===j.id}">${esc(j.name)}${j.number?`<span class="jn">#${esc(j.number)}</span>`:""}</button>`));
  if (!readOnly && DB) chips.push(`<button class="jobchip add" data-addjob="1">+ Add job</button>`);
  $("jobs").innerHTML = chips.join("");
  requestAnimationFrame(() => document.documentElement.style.setProperty("--topH", $("top").offsetHeight + "px"));
}

function localLeftovers(){
  if (ls.get(IMPORTED)) return null;
  try { const d = JSON.parse(ls.get(OLDKEY)); if (!d || !Array.isArray(d.items)) return null; const mine = d.items.filter(i => !i.sample); return mine.length ? {d, n: mine.length} : null; } catch(e){ return null; }
}

function renderBanners(){
  let h = "";
  if (conn === "offline") h += `<div class="banner warn"><div class="grow"><b>Can't reach the shared job data.</b> Sign in to claude.ai, then open this link again. If you're signed in, ask the owner to share the page with you.</div></div>`;
  else if (readOnly) h += `<div class="banner warn"><div class="grow"><b>View only.</b> You can look but changes won't save. Ask the owner to share this page with you as <b style="color:inherit">Editor</b>.</div></div>`;
  if (conn === "live" && !readOnly && !member(me) && state.team.length) h += `<div class="banner"><div class="grow"><b>Who's using this phone?</b> Pick your name so your tasks and uploads are marked as yours.</div><div class="pickrow">${sortedTeam().map(m => `<button class="pick" data-setme="${esc(m.id)}">${av(m)}${esc(m.name)}</button>`).join("")}</div></div>`;
  const left = conn === "live" && !readOnly ? localLeftovers() : null;
  if (left) h += `<div class="banner"><div class="grow"><b>${left.n} item${left.n===1?"":"s"} saved only on this phone.</b> From before the app was shared. Move them in so the team can see them.</div><button class="btn sm amber" data-act="importLocal">Move to shared app</button></div>`;
  if (conn === "live" && !readOnly && state.items.some(i => i.sample)) h += `<div class="banner"><div class="grow"><b>Sample data.</b> These items are examples so you can see how it works. Your jobs and team stay when you clear them.</div><button class="btn sm amber" data-act="clearSample">Clear sample data</button></div>`;
  $("banners").innerHTML = h;
}

function renderHead(){
  const j = jobById(ui.job);
  const d = new Date();
  const dateStr = `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  if (conn === "connecting" || (conn === "live" && !allLoaded())) { $("jobhead").innerHTML = `<div><h2>Loading jobs</h2><div class="meta"><span>Getting the latest from the team</span></div></div><div class="today">${dateStr}</div>`; return; }
  if (!j) {
    const roster = sortedJobs().map(jb => {
      const its = state.items.filter(i => i.jobId === jb.id), late = its.filter(isLate).length, pct = Number(jb.progress)||0;
      const tk = its.filter(i => i.cat === "tkt" && !isDone(i)).length;
      const pm = member(jb.pmId), site = member(jb.siteId);
      return `<button class="jobcard ${late?"hot":""}" data-job="${esc(jb.id)}">

        <div class="jc-stage">${jb.stage ? esc(jb.stage) : "No stage set"}<span>${pct}%</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="jc-ppl"><span>PM <b>${esc(pm ? pm.name : "—")}</b></span><span>Site <b>${esc(site ? site.name : "—")}</b></span><span>Tickets <b>${tk}</b></span></div>
      </button>`;
    }).join("");
    $("jobhead").innerHTML = `<div><h2>All Jobs</h2><div class="meta"><span>${state.jobs.length} active job${state.jobs.length===1?"":"s"}</span><span>${state.team.length} on the team</span></div></div><div class="today">${dateStr}</div>
      ${state.jobs.length ? `<div class="roster">${roster}</div>` : (conn === "live" ? `<div class="empty" style="width:100%"><b>No jobs yet</b>Tap <b style="display:inline;color:var(--accent)">+ Add job</b> to start.</div>` : "")}`;
    return;
  }
  const meta = [j.number && `Job #${esc(j.number)}`, j.location && esc(j.location), j.client && `Owner: ${esc(j.client)}`].filter(Boolean).map(s => `<span>${s}</span>`).join("");
  const its = state.items.filter(i => i.jobId === j.id);
  const openN = cat => its.filter(i => i.cat === cat && !isDone(i)).length;
  const allN = cat => its.filter(i => i.cat === cat).length;
  const lateT = its.filter(i => i.cat === "tkt" && isLate(i)).length;
  const person = (lbl, id) => { const m = member(id); return `<div class="person"><span class="lbl">${lbl}</span>${m ? `<b>${esc(m.name)}</b>` : `<span class="none">Not assigned</span>`}${m && m.phone ? phoneLink(m.phone) : ""}</div>`; };
  const pct = Number(j.progress)||0;
  const q = (tab, lbl, n, sub, hot) => `<button class="qk ${hot?"hot":""}" data-tab="${tab}"><b>${n}</b><span>${lbl}</span>${sub ? `<small>${sub}</small>` : ""}</button>`;
  const nFiles = state.files.filter(f => f.jobId === j.id).length;
  $("jobhead").innerHTML = `<div><h2>${esc(j.name)}</h2><div class="meta">${meta}</div></div><div class="today">${dateStr}</div>
    <div class="jobinfo">
      <div class="people">${person("Project manager", j.pmId)}${person("Site manager", j.siteId)}</div>
      <div class="stage">
        <div class="st-top"><span class="lbl">Where it's holding</span>${readOnly ? "" : `<button class="linkbtn" data-editjob="${esc(j.id)}">Edit job</button>`}</div>
        <b class="st-name">${j.stage ? esc(j.stage) : `<span class="none">No stage set</span>`}</b>
        <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Percent complete"><i style="width:${pct}%"></i></div>
        <div class="st-foot"><span class="pct">${pct}% complete</span>${j.holdNote ? `<span>${esc(j.holdNote)}</span>` : ""}</div>
      </div>
      <div class="quick">
        ${q("tkt","Open tickets", openN("tkt"), lateT ? `${lateT} overdue` : "", lateT)}
        ${q("task","Team tasks", openN("task"), its.filter(i => i.cat==="task" && isLate(i)).length ? `${its.filter(i => i.cat==="task" && isLate(i)).length} overdue` : "", its.some(i => i.cat==="task" && isLate(i)))}
        ${q("files","Photos & files", nFiles, "")}
        ${q("subs","Subcontractors", allN("subs"), "")}
        ${q("vend","Vendors", allN("vend"), "")}
        ${q("dwg","Drawings", allN("dwg"), openN("dwg") ? `${openN("dwg")} in review` : "")}
        ${q("contact","Contacts", allN("contact"), "")}
      </div>
    </div>`;
}

function renderKpis(){
  const its = scoped();
  const late = its.filter(isLate);
  const rfis = its.filter(i => i.cat==="rfi" && !isDone(i));
  const rfiLate = rfis.filter(isLate).length;
  const subm = its.filter(i => i.cat==="subm" && !isDone(i));
  const rr = subm.filter(i => i.status==="Revise & Resubmit").length;
  const inv = its.filter(i => i.cat==="inv" && !isDone(i) && i.status !== "Draft");
  const invAmt = inv.reduce((s,i) => s + unpaid(i), 0);
  const invLate = inv.filter(isLate).reduce((s,i) => s + unpaid(i), 0);
  const owed = its.filter(i => i.cat==="owed" && !isDone(i));
  const owedAmt = owed.reduce((s,i) => s + unpaid(i), 0);
  const cos = its.filter(i => i.cat==="co" && !isDone(i));
  const coAmt = cos.reduce((s,i) => s + (Number(i.amount)||0), 0);
  const k = (tab, lbl, val, foot, cls="") => `<button class="kpi ${cls}" data-tab="${tab}"><span class="lbl">${lbl}</span><span class="val">${val}</span><span class="foot">${foot}</span></button>`;
  $("kpis").innerHTML = [
    k("due","Overdue", late.length, late.length ? `${new Set(late.map(i=>i.cat)).size} categories` : "Nothing past due", late.length ? "hot" : ""),
    k("rfi","Open RFIs", rfis.length, rfiLate ? `${rfiLate} past response date` : "None late"),
    k("subm","Pending submittals", subm.length, rr ? `${rr} revise & resubmit` : "None returned"),
    k("inv","Unpaid invoices", moneyShort(invAmt), invLate ? `${moneyShort(invLate)} past due` : `${inv.length} open`, "money" + (invLate ? " hot" : "")),
    k("owed","You owe", moneyShort(owedAmt), `${owed.length} open payable${owed.length===1?"":"s"}`, "money"),
    k("co","Pending COs", moneyShort(coAmt), `${cos.length} awaiting approval`, "money"),
  ].join("");
}

function renderTabs(){
  const its = scoped();
  const late = its.filter(isLate).length;
  const mine = me ? its.filter(i => i.assignee === me && !isDone(i)).length : 0;
  const t = [`<button class="tab due" role="tab" data-tab="due" aria-selected="${ui.tab==="due"}">Overdue <span class="ct">${late}</span></button>`,
    `<button class="tab" role="tab" data-tab="mine" aria-selected="${ui.tab==="mine"}">My Work <span class="ct">${mine}</span></button>`];
  for (const c of CATS) {
    const n = its.filter(i => i.cat===c.k && !isDone(i)).length;
    t.push(`<button class="tab" role="tab" data-tab="${c.k}" aria-selected="${ui.tab===c.k}">${c.short} <span class="ct">${n}</span></button>`);
  }
  t.push(`<button class="tab" role="tab" data-tab="files" aria-selected="${ui.tab==="files"}">Photos & Files <span class="ct">${scopedFiles().length}</span></button>`);
  $("tabs").innerHTML = t.join("");
  const sel = $("tabs").querySelector('[aria-selected="true"]');
  if (sel) { const tabs = $("tabs"); const l = sel.offsetLeft - 16, r = l + sel.offsetWidth + 32; if (l < tabs.scrollLeft || r > tabs.scrollLeft + tabs.clientWidth) tabs.scrollLeft = l - 40; }
  const fab = $("fab");
  fab.hidden = readOnly || !DB || (ui.tab === "files" && !ASSETS);
  $("fabLbl").textContent = ui.tab === "files" ? "Upload" : ui.tab === "mine" ? "Add task" : ui.tab === "due" ? "Add item" : ("Add " + CAT[ui.tab].one.toLowerCase().replace(/^rfi$/,"RFI"));
  $("btnClosed").setAttribute("aria-pressed", ui.showClosed);
  $("btnClosed").hidden = ui.tab === "due" || ui.tab === "files";
  const who = $("selWho");
  who.hidden = ui.tab === "files" || ui.tab === "mine";
  who.innerHTML = `<option value="">Anyone</option><option value="none">Unassigned</option>` + sortedTeam().map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("");
  who.value = ui.who && (ui.who === "none" || member(ui.who)) ? ui.who : "";

function fileThumb(f){
  const media = isImg(f) ? `<img src="${esc(blobUrl(f))}" alt="${esc(f.caption || f.name)}" loading="lazy">` : `<span class="doc">${esc(isVid(f) ? "VIDEO" : extOf(f))}</span>`;
  return `<button class="thumb" data-file="${esc(f.id)}"><span class="img">${media}</span><span class="cap">${esc(f.caption || f.name)}</span></button>`;
}
const addThumb = (lbl="Add photo") => ASSETS && !readOnly ? `<button class="thumb add" data-upload="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>${lbl}</button>` : "";

function renderFilesStrip(){
  const host = $("filesStrip");
  if (!CAT[ui.tab] || ui.job === "all" || conn !== "live") { host.innerHTML = ""; return; }
  const fs = state.files.filter(f => f.jobId === ui.job && f.cat === ui.tab).sort((a,b) => (b.created||0) - (a.created||0));
  if (!fs.length && !ASSETS) { host.innerHTML = ""; return; }
  host.innerHTML = `<section class="files"><div class="files-h"><div><b>Photos & files</b> <span class="cnt-dot">${fs.length}</span></div><small>${ASSETS ? "Pictures, PDFs and videos for " + esc(CAT[ui.tab].label.toLowerCase()) + " on this job" : "Uploading needs Editor access"}</small></div>
    <div class="thumbs">${addThumb(fs.length ? "Add" : "Add photo")}${fs.map(fileThumb).join("")}</div></section>`;
}

function renderFilesTab(){
  const fs = scopedFiles().slice().sort((a,b) => (b.created||0) - (a.created||0));
  const q = ui.q.trim().toLowerCase();
  const list = q ? fs.filter(f => [f.name, f.caption, fileCatLabel(f.cat), (member(f.by)||{}).name].some(v => String(v||"").toLowerCase().includes(q))) : fs;
  $("listhead").innerHTML = `<div><h3>Photos & Files</h3><div class="hint">Every picture and document${ui.job==="all" ? " across jobs" : " for this job"}, grouped by category.</div></div><div class="tally">${fs.length} file${fs.length===1?"":"s"}</div>`;
  if (!list.length) {
    $("list").innerHTML = `<div class="empty" style="grid-column:1/-1">${q ? `<b>No files match “${esc(ui.q)}”</b>Try a category or a word from the caption.` : `<b>No photos or files yet</b>${ASSETS && !readOnly ? `Tap <b style="display:inline;color:var(--accent)">Upload</b> to add pictures or PDFs to a job.` : "Uploading needs Editor access to this page."}`}</div>`;
    return;
  }
  const groups = {};
  for (const f of list) (groups[f.cat || "general"] = groups[f.cat || "general"] || []).push(f);
  $("list").innerHTML = FILE_CATS.filter(c => groups[c.k]).map(c => `<div class="fgroup" style="grid-column:1/-1"><h5>${esc(c.label)} · ${groups[c.k].length}</h5><div class="thumbs grid">${groups[c.k].map(fileThumb).join("")}</div></div>`).join("");
}

function renderList(){
  if (conn !== "live" || !allLoaded()) {
    $("listhead").innerHTML = "";
    $("list").innerHTML = conn === "offline" ? `<div class="empty"><b>Not connected</b>Job data lives in the team's shared database. Sign in to claude.ai to see it.</div>` : `<div class="loading">Loading the team's jobs…</div>`;
    return;
  }
  if (ui.tab === "files") return renderFilesTab();
  const all = scoped();
  let base;
  if (ui.tab === "due") base = all.filter(isLate);
  else if (ui.tab === "mine") base = me ? all.filter(i => i.assignee === me) : [];
  else base = all.filter(i => i.cat === ui.tab);
  const closedN = base.filter(isDone).length;
  let items = (ui.showClosed || ui.tab === "due") ? base : base.filter(i => !isDone(i));
  if (ui.who && ui.tab !== "mine") items = items.filter(i => ui.who === "none" ? !member(i.assignee) : i.assignee === ui.who);
  const q = ui.q.trim().toLowerCase();
  if (q) items = items.filter(i => [i.num,i.title,i.party,i.notes,i.trade,i.phone,i.email,i.type,i.rev,i.status,(member(i.assignee)||{}).name].some(v => String(v||"").toLowerCase().includes(q)));
  items = sortItems(items);

  const c = CAT[ui.tab];
  let tally = "";
  if (c && c.money) {
    const open = base.filter(i => !isDone(i));
    const sum = open.reduce((s,i) => s + (c.paid ? unpaid(i) : (Number(i.amount)||0)), 0);
    tally = `<div class="tally">${c.paid ? "Unpaid" : "Open total"}<br><b>${money(sum)}</b></div>`;
  } else if (ui.tab !== "due" && closedN) {
    tally = `<div class="tally">${closedN} closed<br>${ui.showClosed ? "shown" : "hidden"}</div>`;
  }
  const meM = member(me);
  const title = ui.tab === "due" ? "Overdue" : ui.tab === "mine" ? (meM ? `${meM.name}'s Work` : "My Work") : c.label;
  const hint = ui.tab === "due" ? "Past the due or follow-up date and still open. Oldest first." : ui.tab === "mine" ? "Everything assigned to you, across every list." : c.hint;
  $("listhead").innerHTML = `<div><h3>${esc(title)}</h3><div class="hint">${esc(hint)}</div></div>${tally}`;

  if (!items.length) {
    let msg;
    if (ui.tab === "mine" && !meM) msg = `<b>Pick your name first</b>Tap <b style="display:inline;color:var(--accent)">Who are you?</b> at the top so the app knows which work is yours.`;
    else if (q) msg = `<b>No matches for “${esc(ui.q)}”</b>Try a number, company or word from the notes.`;
    else if (ui.who) msg = `<b>Nothing here for ${esc(ui.who === "none" ? "unassigned" : (member(ui.who)||{}).name || "that person")}</b>Switch the filter back to Anyone to see everything.`;
    else if (ui.tab === "due") msg = `<b>Nothing overdue</b>Every open item is on schedule.`;
    else if (ui.tab === "mine") msg = `<b>Nothing assigned to you</b>When someone assigns you a task, ticket or RFI it shows up here.`;
    else msg = `<b>No open ${esc(c.label.toLowerCase())}${ui.job!=="all" ? " on this job" : ""}</b>${readOnly ? "" : `Tap <b style="display:inline;color:var(--accent)">+ Add</b> to log the first one.`}${closedN && !ui.showClosed ? ` ${closedN} closed item${closedN===1?" is":"s are"} hidden.` : ""}`;
    $("list").innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  $("list").innerHTML = items.map(card).join("");
}

function dueLabel(it){
  if (!it.due) return "";
  const d = dayDiff(it.due), c = CAT[it.cat];
  const word = c.due.replace(/ date$/,"").replace(/ \/ follow-up$/,"");
  if (isDone(it)) return `<span class="due">${esc(word)} ${fmtDate(it.due)}</span>`;
  if (d < 0) return `<span class="due late">${fmtDate(it.due)} · ${-d}d late</span>`;
  if (d === 0) return `<span class="due soon">Due today</span>`;
  if (d <= 3) return `<span class="due soon">${esc(word)} ${fmtDate(it.due)} · in ${d}d</span>`;
  return `<span class="due">${esc(word)} ${fmtDate(it.due)}</span>`;
}

function card(it){
  const c = CAT[it.cat]; if (!c) return "";
  const late = isLate(it), done = isDone(it);
  const job = ui.job === "all" ? jobById(it.jobId) : null;
  const meta = [];
  if (it.cat === "dwg" && (it.type || it.rev)) meta.push(esc([it.type, it.rev && "Rev " + it.rev].filter(Boolean).join(" · ")));
  if (c.dir) { if (it.trade) meta.push(`<b style="color:var(--fg);font-weight:600">${esc(it.trade)}</b>`); if (it.party) meta.push(esc(it.party)); }
  else if (it.party) meta.push(esc(it.party));
  if (c.money && it.amount !== "" && it.amount != null) {
    if (c.paid && Number(it.paid) > 0 && !done) meta.push(`<span class="amt">${money(unpaid(it))} <small>due of ${money(it.amount)}</small></span>`);
    else meta.push(`<span class="amt">${money(it.amount)}</span>`);
  }
  const nf = state.files.filter(f => f.itemId === it.id).length;
  if (nf) meta.push(`${nf} attachment${nf===1?"":"s"}`);
  let subrow = "";
  if (c.dir) {
    const ns = Number(it.noShows)||0;
    subrow = `<div class="subrow">${it.phone ? phoneLink(it.phone) : `<span class="due">No phone saved</span>`}
      ${c.email && it.email ? `<span class="phone mail" data-stop="1">${esc(it.email)}</span>` : ""}
      ${c.ns ? `<div class="ns ${ns>=2?"bad":""}" data-stop="1"><span>No-shows <b>${ns}</b></span>${readOnly ? "" : `<button data-ns="-1" data-id="${esc(it.id)}" aria-label="Remove a no-show">−</button><button data-ns="1" data-id="${esc(it.id)}" aria-label="Log a no-show">+</button>`}</div>` : ""}</div>`;
  }
  const who = whoChip(it.assignee);
  return `<div class="card ${late?"late":""} ${done?"closed":""}" role="button" tabindex="0" data-id="${esc(it.id)}">
    <div class="c-top"><span class="num">${esc(it.num)}</span>${(ui.tab==="due" || ui.tab==="mine") ? `<span class="cat">${esc(c.short)}</span>` : ""}<span class="sp"></span>${late?`<span class="pill od">Overdue</span>`:""}<span class="pill ${tone(it)}">${esc(it.status)}</span></div>
    <div class="c-title">${esc(it.title)}</div>
    ${meta.length ? `<div class="c-meta">${meta.map(m=>`<span>${m}</span>`).join("")}</div>` : ""}
    ${subrow}
    ${(it.due || job || who) ? `<div class="c-foot">${who}${dueLabel(it)}${job ? `<span class="jobtag">${esc(job.name)}</span>` : ""}</div>` : ""}
    ${it.notes ? `<div class="c-notes">${esc(it.notes)}</div>` : ""}
  </div>`;
}

/* ---------- Sheets ---------- */
function openSheet(html, onMount){
  $("sheetHost").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  document.body.style.overflow = "hidden";
  $("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
  onMount && onMount($("scrim").querySelector(".sheet"));
}
function closeSheet(){ $("sheetHost").innerHTML = ""; document.body.style.overflow = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("scrim")) closeSheet(); });

function armButton(btn, label, fn){
  btn.addEventListener("click", () => {
    if (btn.classList.contains("arm")) { fn(); return; }
    btn.classList.add("arm"); const old = btn.textContent; btn.textContent = label;
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove("arm"); btn.textContent = old; } }, 3500);
  });
}
const teamOptions = (sel, emptyLbl = "Unassigned") => `<option value="">${esc(emptyLbl)}</option>` + sortedTeam().map(m => `<option value="${esc(m.id)}" ${m.id===sel?"selected":""}>${esc(m.name)}${m.role ? " · " + esc(m.role) : ""}</option>`).join("");
function guardWrite(){ if (readOnly || !DB) { toast(readOnly ? "View only. Ask the owner for Editor access." : "Not connected."); return false; } return true; }

/* ---------- Uploads ---------- */
const OK_TYPES = ["image/png","image/jpeg","image/gif","image/webp","application/pdf","video/mp4","video/webm","text/plain","text/csv"];
async function shrinkImage(file){
  // Phone photos are often 4-12 MB; resize to 2400px JPEG so uploads are fast and stay under the 20 MB limit.
  if (!/^image\//.test(file.type) || file.type === "image/gif") return file;
  if (OK_TYPES.includes(file.type) && file.size < 1.5e6) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*scale); cv.height = Math.round(bmp.height*scale);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
    if (!blob) return file;
    return new File([blob], String(file.name||"photo").replace(/\.[^.]+$/,"") + ".jpg", {type:"image/jpeg"});
  } catch(e){ return file; }
}
function typeFor(f){
  if (OK_TYPES.includes(f.type)) return f.type;
  const ext = (String(f.name).match(/\.([a-z0-9]+)$/i)||[])[1];
  const map = {pdf:"application/pdf", jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", gif:"image/gif", webp:"image/webp", mp4:"video/mp4", webm:"video/webm", txt:"text/plain", csv:"text/csv"};
  return ext && map[ext.toLowerCase()] || "";
}
async function uploadFiles(fileList, ctx, onProgress){
  if (!ASSETS) { toast("Uploading needs Editor access to this page."); return 0; }
  let ok = 0;
  const files = Array.from(fileList);
  for (let n = 0; n < files.length; n++) {
    onProgress && onProgress(n, files.length, files[n].name);
    let f = await shrinkImage(files[n]);
    const type = typeFor(f);
    if (!type) { toast(`${files[n].name}: this type can't be uploaded. Save Word or Excel files as PDF first.`); continue; }
    try {
      const res = await ASSETS.upload(f, {type});
      const rec = {id: uid(), jobId: ctx.jobId, cat: ctx.cat || "general", itemId: ctx.itemId || "", assetId: res.id, name: f.name || "file", type: res.contentType || type, size: res.sizeBytes || f.size, caption: ctx.caption || "", by: me || "", created: Date.now()};
      await putDoc("files", rec);
      ok++;
    } catch(e){
      const code = e && e.code;
      const msg = code === "too_large" ? "is over 20 MB" : code === "unsupported_type" ? "isn't a supported file type" : code === "quota_or_state" ? "didn't fit: storage is full" : code === "rate_limited" ? "was skipped: too many uploads at once, try again" : "didn't upload, try again";
      toast(`${files[n].name} ${msg}.`);
    }
  }
  return ok;
}

$("filePick").addEventListener("change", async e => {
  const ctx = pickCtx; pickCtx = null; const fl = Array.from(e.target.files || []);
  e.target.value = "";
  if (!ctx || !fl.length) return;
  // A new item collects files before it exists; they upload once it's saved.
  if (ctx.collect) { if (collectPending) collectPending(fl); return; }
  toast(`Uploading ${fl.length} file${fl.length===1?"":"s"}…`);
  const n = await uploadFiles(fl, ctx);
  if (n) toast(`Uploaded ${n} file${n===1?"":"s"}`);
  if (ctx.after) ctx.after();
});

  const newId = it ? it.id : uid();
  let pendingFiles = [];

  const attachHtml = () => {
    const fs = state.files.filter(f => f.itemId === newId);

  };

  const build = () => {
    const c = CAT[cat];
    const catSel = it ? "" : `<div class="f full"><label for="f-cat">Type</label><select id="f-cat">${CATS.map(x=>`<option value="${x.k}" ${x.k===cat?"selected":""}>${esc(x.label)}</option>`).join("")}</select></div>`;
    const ro = readOnly ? "disabled" : "";
    const assignedBy = it && member(it.assignedBy) && it.assignee ? `<span class="due">Assigned by ${esc(member(it.assignedBy).name)}${it.assignedAt ? " on " + fmtStamp(it.assignedAt) : ""}</span>` : "";
    return `
      <h4>${it ? (readOnly ? "" : "Edit ") : "New "}${esc(c.one)}</h4>
      <p class="shint">${esc(c.hint)}</p>
      <form class="form" id="itemForm" novalidate>
        <fieldset style="display:contents" ${ro}>
        ${catSel}
        <div class="f full"><label for="f-job">Job</label><select id="f-job">${sortedJobs().map(j=>`<option value="${esc(j.id)}" ${j.id===jobId?"selected":""}>${esc(j.name)}</option>`).join("")}</select></div>
        <div class="f full"><label for="f-assignee">Assigned to</label><select id="f-assignee">${teamOptions(v("assignee", cat === "task" ? "" : ""))}</select>${assignedBy}</div>
        <div class="f"><label for="f-num">Number</label><input id="f-num" value="${esc(v("num", nextNum(jobId,cat)))}" autocomplete="off"></div>
        <div class="f"><label for="f-status">Status</label><select id="f-status">${c.statuses.map(s=>`<option ${s===v("status",c.statuses[0])?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
        <div class="f full"><label for="f-title">${esc(c.titleLabel || "Title")}</label><input id="f-title" value="${esc(v("title"))}" placeholder="${c.dir ? (c.email ? "Full name" : "e.g. Shore Line Electric") : "What is it?"}" autocomplete="off"><span class="err" id="e-title" hidden>Give it a title so you can find it later.</span></div>
        ${c.dir ? `
          <div class="f full"><label for="f-trade">${esc(c.tradeLabel)}</label><input id="f-trade" value="${esc(v("trade"))}" placeholder="${esc(c.tradePh)}" list="tradeList-${c.k}"></div>
          <datalist id="tradeList-${c.k}">${[...new Set(state.items.filter(i=>i.cat===c.k).map(i=>i.trade).filter(Boolean))].sort().map(p=>`<option value="${esc(p)}">`).join("")}</datalist>
          <div class="f"><label for="f-phone">Phone</label><input id="f-phone" type="tel" inputmode="tel" value="${esc(v("phone"))}" placeholder="(732) 555-0100"></div>
          <div class="f"><label for="f-party">${esc(c.party)}</label><input id="f-party" value="${esc(v("party"))}" ${c.email ? 'list="partyList"' : ""}></div>
          ${c.email ? `<div class="f full"><label for="f-email">Email</label><input id="f-email" type="email" inputmode="email" autocomplete="off" value="${esc(v("email"))}" placeholder="name@company.com"></div>` : ""}
          ${c.ns ? `<div class="f full"><label for="f-ns">No-shows</label><input id="f-ns" type="number" min="0" inputmode="numeric" value="${esc(v("noShows",0))}"></div>` : ""}
        ` : `<div class="f full"><label for="f-party">${esc(c.party)}</label><input id="f-party" value="${esc(v("party"))}" placeholder="Company or person" list="partyList"></div>`}
        ${c.types ? `<div class="f"><label for="f-rev">Revision</label><input id="f-rev" value="${esc(v("rev"))}" placeholder="e.g. 4" autocomplete="off"></div><div class="f"><label for="f-type">Drawing type</label><select id="f-type">${c.types.map(t=>`<option ${t===v("type",c.types[0])?"selected":""}>${esc(t)}</option>`).join("")}</select></div>` : ""}
        ${c.money ? `<div class="f"><label for="f-amount">Amount ($)</label><input id="f-amount" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(v("amount"))}" placeholder="0"></div>` : ""}
        ${c.paid ? `<div class="f"><label for="f-paid">Paid so far ($)</label><input id="f-paid" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(v("paid"))}" placeholder="0"></div>` : ""}
        ${c.noDue ? "" : `<div class="f ${c.money && !c.paid ? "" : "full"}"><label for="f-due">${esc(c.due)}</label><input id="f-due" type="date" value="${esc(v("due"))}"></div>`}
        <div class="f full"><label for="f-notes">Notes</label><textarea id="f-notes" placeholder="Who you spoke to, what was promised, next step">${esc(v("notes"))}</textarea></div>
        <datalist id="partyList">${[...new Set(state.items.map(i=>i.party).filter(Boolean))].sort().map(p=>`<option value="${esc(p)}">`).join("")}</datalist>
        </fieldset>
        <div class="full" id="attachBox" style="grid-column:1/-1">${attachHtml()}</div>
      </form>
      <div class="actions">
        ${it && !readOnly ? `<button class="btn danger" id="btnDel" type="button">Delete</button>` : ""}

      </div>`;

  const mount = sheet => {
    const read = () => ({
      title: $("f-title")?.value, num: $("f-num")?.value, status: $("f-status")?.value, party: $("f-party")?.value, assignee: $("f-assignee")?.value,
      trade: $("f-trade")?.value, phone: $("f-phone")?.value, email: $("f-email")?.value, rev: $("f-rev")?.value, noShows: $("f-ns")?.value, type: $("f-type")?.value,
      amount: $("f-amount")?.value, paid: $("f-paid")?.value, due: $("f-due")?.value, notes: $("f-notes")?.value,
    });
    const rebuild = () => { const keep = read(); sheet.innerHTML = `<div class="grab"></div>` + build(); for (const k of ["title","party","due","notes","amount","paid","trade","phone","email","rev","assignee"]) { const el = $("f-"+k); if (el && keep[k]) el.value = keep[k]; } wire(); };
    const refreshAttach = () => { const box = $("attachBox"); if (box) { box.innerHTML = attachHtml(); wireAttach(); } };
    const wireAttach = () => {
      $("btnAttach") && $("btnAttach").addEventListener("click", () => {
        if (it) pickFiles({jobId: it.jobId, cat: it.cat, itemId: it.id, after: refreshAttach});
        else { pickCtx = {collect: true}; $("filePick").click(); }
      });
    };
    collectPending = files => { pendingFiles = pendingFiles.concat(Array.from(files)); refreshAttach(); };
    const wire = () => {
      $("f-cat") && $("f-cat").addEventListener("change", e => { cat = e.target.value; rebuild(); });
      $("f-job") && $("f-job").addEventListener("change", e => { jobId = e.target.value; if (!it) $("f-num").value = nextNum(jobId, cat); });
      $("btnCancel").addEventListener("click", closeSheet);
      $("btnSave") && $("btnSave").addEventListener("click", submit);
      $("itemForm").addEventListener("submit", e => { e.preventDefault(); submit(); });
      $("btnDel") && armButton($("btnDel"), "Tap again to delete", () => {
        delDoc("items", it.id); closeSheet(); toast(`Deleted ${it.num}`);
      });
      wireAttach();
    };
    const submit = () => {
      if (!guardWrite()) return;
      const f = read();
      if (!f.title || !f.title.trim()) { $("e-title").hidden = false; $("f-title").focus(); return; }
      const c = CAT[cat];
      const rec = {
        ...(it || {}), id: newId, cat, jobId, num: (f.num||"").trim() || nextNum(jobId, cat), title: f.title.trim(), status: f.status,
        party: (f.party||"").trim(), due: f.due || "", notes: (f.notes||"").trim(),
        amount: c.money ? (f.amount === "" ? "" : Number(f.amount)) : "",
        assignee: f.assignee || "", updated: Date.now(), updatedBy: me || "",
      };
      if (!it) rec.created = Date.now();
      if ((f.assignee || "") !== (it ? it.assignee || "" : "")) { rec.assignedBy = me || ""; rec.assignedAt = Date.now(); }
      if (c.paid) rec.paid = f.paid === "" ? 0 : Number(f.paid);
      if (c.paid && rec.status === "Paid" && rec.amount !== "") rec.paid = rec.amount;
      if (c.types) { rec.type = f.type; rec.rev = (f.rev||"").trim(); }
      if (c.dir) { rec.trade = (f.trade||"").trim(); rec.phone = (f.phone||"").trim(); }
      if (c.ns) rec.noShows = Math.max(0, parseInt(f.noShows,10)||0);
      if (c.email) rec.email = (f.email||"").trim();
      if (c.noDue) rec.due = it ? (it.due || "") : "";
      delete rec.sample;
      putDoc("items", rec);
      const toUpload = pendingFiles; pendingFiles = [];
      closeSheet();
      if (!it && ui.tab !== "due" && ui.tab !== "mine") ui.tab = cat;
      render();
      const who = member(rec.assignee);
      toast(it ? `Saved ${rec.num}` : `Added ${rec.num}${who ? " for " + who.name : ""}`);
      if (toUpload.length) uploadFiles(toUpload, {jobId, cat, itemId: newId}).then(n => n && toast(`Attached ${n} file${n===1?"":"s"} to ${rec.num}`));
    };
    wire();
    if (!it) setTimeout(() => $("f-title") && $("f-title").focus(), 60);
  };
  openSheet(build(), mount);
}

      putDoc("team", rec); menuSheet(); toast(m ? "Saved" : `Added ${name}`);
    });
    m && armButton($("mDel"), "Tap again to remove", () => { delDoc("team", m.id); if (me === m.id) setMe(""); menuSheet(); toast(`Removed ${m.name}`); });
  });
}
function meSheet(){
  openSheet(`
    <h4>Who are you?</h4>
    <p class="shint">This phone remembers your choice. It decides what shows in My Work and marks your uploads and assignments as yours.</p>
    ${state.team.length ? `<div class="pickrow">${sortedTeam().map(m => `<button class="pick" data-setme="${esc(m.id)}" aria-pressed="${m.id===me}">${av(m)}<span>${esc(m.name)}<br><small>${esc(m.role||"")}</small></span></button>`).join("")}</div>` : `<div class="empty">No team members yet. Add them in Settings.</div>`}
    <div class="actions"><button class="btn primary" id="meDone" type="button">Done</button></div>`, () => { $("meDone").addEventListener("click", closeSheet); });
}

/* ---------- Bulk helpers ---------- */
async function runQueue(tasks, onStep){
  for (let i = 0; i < tasks.length; i++) { try { await tasks[i](); } catch(e){} onStep && onStep(i+1, tasks.length); if (i % 10 === 9) await new Promise(r => setTimeout(r, 150)); }
}
async function clearSample(){
  if (!guardWrite()) return;
  const its = state.items.filter(i => i.sample);
  toast(`Clearing ${its.length} sample items…`);
  const jobs = state.jobs.filter(j => j.sampleInfo).map(j => { const c = {...j}; delete c.stage; delete c.progress; delete c.holdNote; delete c.sampleInfo; return c; });
  await runQueue(jobs.map(j => () => putDoc("jobs", j)).concat(its.map(i => () => delDoc("items", i.id))));
  toast(`Cleared ${its.length} sample items`);
}
async function importData(d, fromPhone){
  if (!guardWrite()) return;
  const jobs = (d.jobs || []).filter(j => j && j.id && j.name);
  const items = (d.items || []).filter(i => i && !i.sample && i.cat && CAT[i.cat] && i.jobId);
  const tasks = [];
  for (const j of jobs) if (!jobById(j.id) && items.some(i => i.jobId === j.id)) { const r = {id:j.id, name:j.name, number:j.number||"", location:j.location||"", client:j.client||"", stage:j.stage||"", progress:j.progress||"", holdNote:j.holdNote||"", order: state.jobs.length + tasks.length}; tasks.push(() => putDoc("jobs", r)); }
  for (const i of items) if (!state.items.some(x => x.id === i.id)) { const r = {...i}; delete r.sample; tasks.push(() => putDoc("items", r)); }
  toast(`Moving ${items.length} items…`);
  await runQueue(tasks);
  if (fromPhone) ls.set(IMPORTED, "1");
  scheduleRender(); toast(`Moved ${items.length} item${items.length===1?"":"s"} into the shared app`);
}

/* ---------- Settings ---------- */
function menuSheet(){
  const hasSample = state.items.some(i => i.sample);
  openSheet(`
    <h4>Settings & team</h4>
    <p class="shint">Everything here is shared. Anyone the page is shared with as Editor sees the same jobs, tasks and photos, live.</p>
    <div class="menu">
      <div class="mrow"><div class="t">Team</div>
        ${sortedTeam().map(m => `<div class="jobline">${av(m)}<div class="grow"><div class="n">${esc(m.name)}</div><div class="m">${[esc(m.role||""), esc(m.phone||""), state.items.filter(i => i.assignee === m.id && !isDone(i)).length + " open assigned"].filter(Boolean).join(" · ")}</div></div>${readOnly ? "" : `<button class="btn sm" data-editmember="${esc(m.id)}">Edit</button>`}</div>`).join("") || `<div class="d">No team members yet.</div>`}
        ${readOnly ? "" : `<div class="r"><button class="btn sm" id="mAddMember">+ Add team member</button></div>`}
      </div>
      <div class="mrow"><div class="t">Jobs</div>
        ${sortedJobs().map(j => `<div class="jobline"><div class="grow"><div class="n">${esc(j.name)}</div><div class="m">${[j.number && "#"+esc(j.number), member(j.pmId) && "PM " + esc(member(j.pmId).name), member(j.siteId) && "Site " + esc(member(j.siteId).name)].filter(Boolean).join(" · ")}</div></div>${readOnly ? "" : `<button class="btn sm" data-editjob="${esc(j.id)}">Edit</button>`}</div>`).join("") || `<div class="d">No jobs yet.</div>`}
        ${readOnly ? "" : `<div class="r"><button class="btn sm" id="mAddJob">+ Add job</button></div>`}
      </div>
      <div class="mrow"><div class="t">How the team gets in</div>
        <div class="d">1. Open this page on claude.ai and tap Share. 2. Invite each person by email as <b>Editor</b> (Editors can upload photos). 3. They sign in to claude.ai with that email, open the link and add it to their home screen. 4. Each person taps "Who are you?" once.</div>
      </div>
      ${hasSample && !readOnly ? `<div class="mrow"><div class="t">Sample data</div><div class="d">${state.items.filter(i=>i.sample).length} example items are loaded. Clearing removes only the examples. Items anyone added or edited stay.</div><div class="r"><button class="btn sm amber" id="mClear">Clear sample data</button></div></div>` : ""}
      <div class="mrow"><div class="t">Backup</div>
        <div class="d">Copy all job data as text and paste it into an email to yourself. Photos stay in the app. To bring items in from an old backup, paste it under Import.</div>
        <div class="r"><button class="btn sm" id="mExport">Copy backup</button>${readOnly ? "" : `<button class="btn sm" id="mImportShow">Import</button>`}</div>
        <div id="exportBox" hidden><div class="f"><label for="exportText">Backup text</label><textarea class="code" id="exportText" readonly></textarea></div></div>
        <div id="importBox" hidden>
          <div class="f"><label for="importText">Paste backup</label><textarea class="code" id="importText" placeholder='{"jobs":[...'></textarea></div>
          <span class="err" id="importErr" hidden></span>
          <div class="r" style="margin-top:8px"><button class="btn sm" id="mImport">Add these items</button></div>
        </div>
      </div>
    </div>
    <div class="actions"><button class="btn primary" id="mDone" type="button">Done</button></div>`, sheet => {
    $("mDone").addEventListener("click", closeSheet);
    $("mAddJob") && $("mAddJob").addEventListener("click", () => jobForm());
    $("mAddMember") && $("mAddMember").addEventListener("click", () => memberForm());
    sheet.querySelectorAll("[data-editjob]").forEach(b => b.addEventListener("click", () => jobForm(jobById(b.dataset.editjob))));
    sheet.querySelectorAll("[data-editmember]").forEach(b => b.addEventListener("click", () => memberForm(member(b.dataset.editmember))));
    $("mClear") && armButton($("mClear"), "Tap again to clear", () => { closeSheet(); clearSample(); });
    $("mExport").addEventListener("click", () => {
      const txt = JSON.stringify({v:3, jobs: state.jobs, items: state.items, team: state.team, files: state.files}); $("exportBox").hidden = false; $("exportText").value = txt;
      const sel = () => { $("exportText").focus(); $("exportText").select(); };
      try { navigator.clipboard.writeText(txt).then(() => toast("Backup copied"), () => { sel(); toast("Select all and copy the text"); }); }
      catch(e){ sel(); toast("Select all and copy the text"); }
    });
    $("mImportShow") && $("mImportShow").addEventListener("click", () => { $("importBox").hidden = false; $("importText").focus(); });
    $("mImport") && $("mImport").addEventListener("click", () => {
      try { const d = JSON.parse($("importText").value); if (!d || !Array.isArray(d.items)) throw 0; closeSheet(); importData(d, false); }
      catch(e){ const el = $("importErr"); el.hidden = false; el.textContent = "That text isn't a Ray Builders backup. Paste the whole backup, starting with {"; }
    });
  });
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const sm = t.closest("[data-setme]"); if (sm) { setMe(sm.dataset.setme); if ($("scrim")) closeSheet(); toast(`Hi ${(member(sm.dataset.setme)||{}).name || ""}`); return; }
  const ns = t.closest("[data-ns]");
  if (ns) { if (!guardWrite()) return; const it = state.items.find(i => i.id === ns.dataset.id); if (it) { const rec = {...it, noShows: Math.max(0, (Number(it.noShows)||0) + Number(ns.dataset.ns))}; delete rec.sample; putDoc("items", rec); if (+ns.dataset.ns > 0) toast(`No-show logged for ${it.title}`); } return; }
  if (t.closest("[data-stop]")) return;
  const fl = t.closest("[data-file]"); if (fl) { const f = state.files.find(x => x.id === fl.dataset.file); if (f) fileSheet(f); return; }
  if (t.closest("[data-upload]") && !t.closest("#scrim")) { pickFiles({jobId: ui.job !== "all" ? ui.job : (sortedJobs()[0]||{}).id, cat: CAT[ui.tab] ? ui.tab : "general"}); return; }
  const jc = t.closest("[data-job]"); if (jc) { ui.job = jc.dataset.job; render(); return; }
  if (t.closest("[data-addjob]")) { jobForm(); return; }
  const ej = t.closest(".jobinfo [data-editjob]"); if (ej) { jobForm(jobById(ej.dataset.editjob)); return; }
  const tb = t.closest("[data-tab]"); if (tb) { ui.tab = tb.dataset.tab; render(); if (tb.classList.contains("kpi") || tb.classList.contains("qk")) $("tabsbar").scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const cd = t.closest(".card[data-id]"); if (cd) { const it = state.items.find(i => i.id === cd.dataset.id); if (it) itemForm(it); return; }
  const act = t.closest("[data-act]");
  if (act) {
    if (!act.classList.contains("arm")) { act.classList.add("arm"); act.dataset.old = act.textContent; act.textContent = "Tap again to confirm"; setTimeout(() => { if (act.isConnected) { act.classList.remove("arm"); act.textContent = act.dataset.old; } }, 3500); return; }
    if (act.dataset.act === "clearSample") clearSample();
    if (act.dataset.act === "importLocal") { const left = localLeftovers(); if (left) importData(left.d, true); }
    return;
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("card")) { e.preventDefault(); e.target.click(); }
});
$("fab").addEventListener("click", () => {
  if (ui.tab === "files") return uploadSheet();
  itemForm(null, ui.tab === "due" ? "open" : ui.tab === "mine" ? "task" : ui.tab);
});
$("btnMenu").addEventListener("click", menuSheet);
$("btnMe").addEventListener("click", meSheet);
$("btnClosed").addEventListener("click", () => { ui.showClosed = !ui.showClosed; render(); });
$("selWho").addEventListener("change", e => { ui.who = e.target.value; render(); });
$("q").value = ui.q || "";
$("q").addEventListener("input", e => { ui.q = e.target.value; renderList(); ls.set(UIKEY, JSON.stringify(ui)); });
window.addEventListener("resize", () => document.documentElement.style.setProperty("--topH", $("top").offsetHeight + "px"));

render();
connect();
})();
</script>
